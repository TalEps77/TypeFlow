  # Story 7.3 spike verdict: CUT. AudioStreamTranscriber.startStreamTranscription()
  # calls audioProcessor.startRecordingLive(), which (WhisperKit
  # Core/Audio/AudioProcessor.swift:975-1019, setupEngine()) constructs its own
  # AVAudioEngine, acquires its own inputNode, installs its own tap, and calls
  # engine.start() -- entirely independent of and in direct conflict with
  # AudioEngine's own installed tap on the same physical input device (R-1,
  # confirmed by reading WhisperKit 0.18.0 source, not by running the conflict
  # live). There is no supported way to hand AudioStreamTranscriber an
  # already-running engine/tap; using it means either re-architecting
  # AudioEngine to hand capture ownership to WhisperKit's AudioProcessor
  # (AD-8-violating rewrite of the Bluetooth/device-selection/exception-catching
  # logic Epics 1-6 depend on) or reimplementing AudioStreamTranscriber's
  # segment-confirmation/VAD-gating/early-stop logic from scratch against
  # AudioEngine's own captured buffer. Both are the re-architecture the epics.md
  # AC explicitly says to cut on. Feature cut per that explicit branch; no
